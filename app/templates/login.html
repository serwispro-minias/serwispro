<!DOCTYPE html>
<html lang="pl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        SerwisPRO - Logowanie
    </title>


    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">

</head>


<body class="login-body">


    <div class="login-box">


        <h1>
            SerwisPRO
        </h1>


        <p>
            System obsługi punktów serwisowych
        </p>


        <form method="POST">


            <label>
                Login
            </label>


            <input type="text" name="username" placeholder="Wpisz login">



            <label>
                Hasło
            </label>


            <input type="password" name="password" placeholder="Wpisz hasło">



            <button type="submit">
                Zaloguj
            </button>


        </form>


    </div>

    <div class="login-footer">

        <div class="producer">

            Producent oprogramowania

            <strong>ACES Projekt Sp. z o.o.</strong>

        </div>

        <div class="links">

            <a href="https://acesprojekt.pl" target="_blank">
                www.acesprojekt.pl
            </a>

            |

            <a href="https://minias.pl" target="_blank">
                www.minias.pl
            </a>

        </div>

    </div>

</body>

</html>
