{% extends "base.html" %}

{% block title %}Dostawca {{ entity.code }}{% endblock %}

{% block content %}
<div class="page-header d-flex justify-content-between align-items-center mb-3">
    <div>
        <h1 class="h3">Dostawca: {{ entity.name }}</h1>
        <small class="text-muted">Kod: {{ entity.code }}</small>
    </div>
    <div class="d-flex gap-2">
        <a class="btn btn-secondary" href="{{ url_for('catalog.suppliers_edit', supplier_id=entity.id) }}">Edytuj</a>
        <a class="btn btn-outline-secondary" href="{{ url_for('catalog.suppliers_index') }}">Powrót</a>
    </div>
</div>

<div class="card">
    <div class="card-body">
        <p><strong>E-mail:</strong> {{ entity.email or '-' }}</p>
        <p><strong>Telefon:</strong> {{ entity.phone or '-' }}</p>
        <p><strong>Adres:</strong> {{ entity.address or '-' }}</p>
        <form method="post" action="{{ url_for('catalog.suppliers_delete', supplier_id=entity.id) }}" onsubmit="return confirm('Usunąć dostawcę?');">
            <button type="submit" class="btn btn-outline-danger">Usuń</button>
        </form>
    </div>
</div>
{% endblock %}
