{% extends "base.html" %}
{% block title %}Nowe RW{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Nowe RW</h1>
<form method="post" id="warehouse-document-form" data-shortcut-save>{{ form.hidden_tag() }}
    <div class="row g-3 mb-3">
        <div class="col-md-4"><label class="form-label">Data</label><input class="form-control" type="date"
                name="issue_date"></div>
        <div class="col-md-4"><label class="form-label">Zlecenie ID</label><input class="form-control" type="number"
                min="1" name="service_order_id"></div>
        <div class="col-md-4 d-flex align-items-end"><button class="btn btn-outline-primary" type="button"
                id="add-assortment" data-shortcut-insert data-shortcut-hint="Dodaj pozycję (Insert)">+ Dodaj
                asortyment</button></div>
    </div>
    <div class="border rounded p-3 mb-3 d-none" id="product-selector" data-search-picker
        data-trigger-id="add-assortment"><label class="form-label" for="product-search">Szukaj produktu</label><input
            class="form-control" id="product-search" autocomplete="off" placeholder="Kod, nazwa, EAN..." role="combobox"
            aria-expanded="false" aria-controls="product-results" data-keyboard-listbox-input
            data-live-search-url="{{ url_for('catalog.parts_search') }}" data-result-limit="20" data-min-length="2">
        <div class="list-group mt-2" id="product-results" role="listbox"></div>
    </div>
    <table class="table table-striped" id="document-items">
        <thead>
            <tr>
                <th>Produkt</th>
                <th>Stan</th>
                <th>Ilość</th>
                <th>Cena z kartoteki</th>
                <th>Wartość</th>
                <th></th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    <div class="text-muted mb-3" id="empty-items-message">Brak pozycji. Użyj „+ Dodaj asortyment”.</div>
    <div class="mb-3"><label class="form-label">Uwagi</label><textarea class="form-control" name="notes"></textarea>
    </div><button class="btn btn-primary" type="submit" data-shortcut-save-submit
        data-shortcut-hint="Zapisz / Utwórz RW (Ctrl + S)">Utwórz RW</button>
</form>
<script>
    (function () {
        const selector = document.getElementById('product-selector'); const search = document.getElementById('product-search'); const tbody = document.querySelector('#document-items tbody'); const emptyMessage = document.getElementById('empty-items-message'); const addButton = document.getElementById('add-assortment'); let selectedRow = null;
        function recalc(row) { const qty = parseFloat(row.querySelector('.item-qty').value || '0'); const price = parseFloat(row.dataset.salePrice || '0'); row.querySelector('.item-value').textContent = (qty * price).toFixed(2); }
        function renumber() { tbody.querySelectorAll('tr').forEach((row, index) => row.querySelectorAll('[name]').forEach(input => input.name = input.name.replace(/items-\d+-/, `items-${index}-`))); emptyMessage.classList.toggle('d-none', tbody.children.length > 0); }
        function addProduct(product) { if (tbody.querySelector(`tr[data-product-id="${product.id}"]`)) return; const row = document.createElement('tr'); row.dataset.productId = product.id; row.dataset.salePrice = product.sale_price_net || '0'; row.dataset.selectableRow = ''; row.innerHTML = '<td></td><td></td><td><input class="form-control item-qty" type="number" min="1" step="1" name="items-0-quantity" value="1"></td><td></td><td class="item-value">0.00</td><td><button class="btn btn-sm btn-outline-danger remove-item" type="button" data-shortcut-delete data-shortcut-hint="Usuń pozycję (Delete)">Usuń pozycję</button></td>'; row.cells[0].append(document.createTextNode(`${product.code} | ${product.name}`)); const productId = document.createElement('input'); productId.type = 'hidden'; productId.name = 'items-0-inventory_item_id'; productId.value = String(product.id); row.cells[0].append(productId); row.cells[1].textContent = String(product.current_stock); row.cells[3].textContent = String(product.sale_price_net); tbody.appendChild(row); selectedRow = row; renumber(); recalc(row); row.querySelector('.item-qty').focus(); row.querySelector('.item-qty').addEventListener('input', () => recalc(row)); row.querySelector('.remove-item').addEventListener('click', () => { row.remove(); renumber(); }); }
        search.addEventListener('live-search:select', event => { selector.classList.add('d-none'); addProduct(event.detail); });
        addButton.addEventListener('click', () => { selector.hidden = false; selector.classList.remove('d-none'); search.focus(); }); tbody.addEventListener('click', event => { selectedRow = event.target.closest('tr') || selectedRow; }); emptyMessage.classList.remove('d-none');
    })();
</script>
{% endblock %}
